<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>While loop practice page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#18243A; --muted:#5B6880; --line:#D5DCE6;
  --accent:#2952D9; --accent-ink:#FFFFFF; --accent-soft:#E4EAFC; --accent-strong:#1F3FAE;
  --loop:#D08A12; --loop-soft:#FCF1DC; --loop-ink:#8A5A06;
  --ok:#23845A; --ok-soft:#E1F3EA; --bad:#C23B32; --bad-soft:#FBE7E5; --stage:#FAFBFD;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#182030; --surface-2:#1E2738; --ink:#E6EBF3; --muted:#98A3B8; --line:#2C374B;
    --accent:#7393FF; --accent-ink:#0D1426; --accent-soft:#22305A; --accent-strong:#B5C6FF;
    --loop:#F0B04A; --loop-soft:#2E2614; --loop-ink:#F5C77A;
    --ok:#4CC38A; --ok-soft:#173326; --bad:#F07167; --bad-soft:#3A1C1A; --stage:#141B28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#182030; --surface-2:#1E2738; --ink:#E6EBF3; --muted:#98A3B8; --line:#2C374B;
  --accent:#7393FF; --accent-ink:#0D1426; --accent-soft:#22305A; --accent-strong:#B5C6FF;
  --loop:#F0B04A; --loop-soft:#2E2614; --loop-ink:#F5C77A;
  --ok:#4CC38A; --ok-soft:#173326; --bad:#F07167; --bad-soft:#3A1C1A; --stage:#141B28;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit}
h1,h2,h3{margin:0}
a{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:1.3rem;font-weight:700}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;padding:20px 28px 40px;max-width:1500px;margin:0 auto;align-items:start}
.nav{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:calc(100vh - 40px);overflow:auto}
.nav a{display:block;padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.88rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.nav .ngroup{margin-top:10px;padding:0 10px 2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.nav .ngroup span{font-weight:400}
.nav .sub{padding-left:20px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface-2)}

/* Overview */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.intro h2{font-size:1.1rem;margin-bottom:6px}
.intro p{margin:0 0 8px;max-width:75ch}
.intro p:last-child{margin-bottom:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:1rem}
.card .tpl{font-size:.78rem;color:var(--muted);margin:2px 0 10px}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.card li a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;text-decoration:none;color:var(--ink);font-size:.9rem}
.card li a:hover{border-color:var(--accent);background:var(--accent-soft)}
.ui-tag{font-size:.74rem;color:var(--muted);white-space:nowrap}

/* Scenario view */
.sc-head{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.sc-head h2{font-size:1.2rem}
.sc-head .tpl{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.siblings{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.siblings a{font-size:.82rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.siblings a[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.setup{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.setup label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:500}
.setup input[type=number]{width:120px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.setup .check{flex-direction:row;align-items:center;gap:8px;padding-bottom:8px}
.setup .check input{width:18px;height:18px;accent-color:var(--accent)}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.box-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box-head h3{font-size:.95rem;font-weight:600}
.state-pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.state-pill.true{background:var(--loop-soft);color:var(--loop-ink)}
.state-pill.false{background:var(--ok-soft);color:var(--ok)}
.stage{background:var(--stage);padding:20px;min-height:240px}
.meter{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.meter strong{color:var(--ink)}

/* Elements under test */
.t-btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer}
.t-btn:hover{filter:brightness(1.07)}
.t-btn.secondary{background:var(--surface);color:var(--accent)}
.t-btn:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.t-btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad);padding:5px 12px}
.t-btn.danger:hover{background:var(--bad-soft)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.product{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.88rem;text-align:center}
.indicator{font-weight:600;margin:0}
.success{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:8px;padding:10px 14px;font-weight:600;margin:0}
.notice{color:var(--muted);margin:0;font-size:.9rem}
.flash{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;margin:0;font-size:.9rem;font-weight:500}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:.85rem}
.badge.pending{background:var(--loop-soft);color:var(--loop-ink)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:4px;max-width:260px;flex:1;min-width:160px}
.field label{font-size:.85rem;font-weight:500}
.field input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.field input[readonly]{background:var(--surface-2)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--ok)}
.steps-bar{display:flex;gap:6px;flex-wrap:wrap}
.steps-bar span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.steps-bar span.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);font-weight:600}
.status-chip{display:inline-block;background:var(--loop-soft);color:var(--loop-ink);border-radius:6px;padding:4px 10px;font-weight:600;margin:0;align-self:flex-start}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--surface)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.8rem}
.dialog-backdrop{position:relative;border-radius:10px;padding:18px;background:rgba(24,36,58,.35)}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dialog h3{font-size:1rem;margin-bottom:4px}
.dialog p{margin:0 0 12px;font-size:.9rem}
.slide{height:130px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:1.2rem;color:#fff}
.progress{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.timer{font-size:1.6rem;font-weight:700;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:2px 10px;font-size:.84rem;font-weight:500}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0;background:var(--surface)}
legend{font-weight:600;padding:0 4px}
.radio{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.radio input{width:17px;height:17px;accent-color:var(--accent)}
.skeleton{height:12px;border-radius:6px;background:var(--line);margin:6px 0;max-width:320px}
.download{display:inline-block;font-weight:600}

/* ContextQA steps */
.cq{padding:14px 16px}
.cq h4{font-size:.8rem;color:var(--muted);font-weight:600;margin:12px 0 4px}
.cq h4:first-child{margin-top:0}
.cq ol{margin:0;padding-left:20px;font-size:.84rem}
.cq li{margin:3px 0;overflow-wrap:anywhere}
.cq .cond{border:1px solid var(--loop);border-left-width:5px;background:var(--loop-soft);border-radius:7px;padding:8px 10px;font-size:.84rem;font-weight:500}
.cq .inside{border-left:3px solid var(--loop);margin-left:8px;padding-left:12px}
.cq .tip{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.cq code{font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.copy-row{padding:0 16px 14px}
/* Text written by ::before is not page text, so instructions never satisfy a page-text check */
.ref::before{content:"\201C" attr(data-text) "\201D";font-weight:600}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1050px){ .grid2{grid-template-columns:1fr} }
@media (max-width:780px){
  .layout{grid-template-columns:1fr;padding:14px}
  .nav{position:static;max-height:260px}
  .top{padding:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>While loop practice page</h1>
    <p>33 live scenarios, 3 for every ContextQA While template. Point your test at a scenario and watch the loop run until the condition turns false.</p>
  </div>
  <div class="top-actions">
    <a class="btn" href="index.html">Open the test builder</a>
    <button class="btn" id="themeBtn" type="button">Dark mode</button>
  </div>
</header>

<div class="layout">
  <nav class="nav" id="nav" aria-label="Scenarios"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = t => '<span class="ref" data-text="' + esc(t) + '"></span>';  /* shown to people, not page text */
const Q = t => '“' + esc(t) + '”';
const $ = s => document.querySelector(s);
const on = s => s.never || s.n < s.count;          /* the usual "keep looping" rule */
const left = s => s.never ? 'many' : s.count - s.n;
const B = (id, text, act, o = {}) => '<button type="button" class="t-btn ' + (o.cls || '') + '"' + (o.multi ? '' : ' id="' + id + '"') +
  ' data-testid="' + id + '" data-do="' + act + '"' + (o.i !== undefined ? ' data-i="' + o.i + '"' : '') + (o.disabled ? ' disabled' : '') +
  (o.aria ? ' aria-label="' + esc(o.aria) + '"' : '') + '>' + esc(text) + '</button>';
const IN = (id, label, value, o = {}) => '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input id="' + id + '" data-testid="' + id + '" name="' + id + '"' +
  ' value="' + esc(value) + '"' + (o.ro ? ' readonly' : '') + (o.bind ? ' data-bind="' + o.bind + '"' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + ' autocomplete="off"></div>';
const OK = (id, text) => '<p class="success" id="' + id + '" data-testid="' + id + '">' + esc(text) + '</p>';
const ERR = (id, text) => '<p class="flash" id="' + id + '" data-testid="' + id + '">' + esc(text) + '</p>';
const NOTE = t => '<p class="notice">' + t + '</p>';
const ROW = (...x) => '<div class="row">' + x.join('') + '</div>';
const STACK = (...x) => '<div class="stack">' + x.join('') + '</div>';
const xp = id => '<code>(//*[@data-testid=\'' + id + '\'])[1]</code>';
const WAIT = 'Wait for ' + Q('1') + ' seconds';

/* ---------- Templates and their 3 scenarios each ---------- */
const TEMPLATES = [
{ id:191, name:'verifyElementVisibleWhile', title:'Element is visible', template:'While element #{label} is visible on the page', variants:[
  { ex:'Delete buttons', ui:'Button list', about:'Click the first Delete button until no Delete buttons are left.', countLabel:'Delete buttons to start with',
    init:s => { s.next = s.count + 1; s.items = Array.from({length:s.count}, (_, i) => i + 1); },
    isTrue:s => s.items.length > 0,
    render:(s, t) => STACK(
      ROW(B('add-delete-button', 'Add delete button', 'add', {cls:'secondary'}), t ? NOTE(s.items.length + ' delete button' + (s.items.length === 1 ? '' : 's') + ' left') : ''),
      t ? '<ul class="list">' + s.items.map((n, i) => '<li><span>Item ' + n + '</span>' + B('delete-button', 'Delete', 'del', {cls:'danger', multi:true, i}) + '</li>').join('') + '</ul>'
        : OK('all-deleted', 'All delete buttons are gone')),
    act:{ add:s => s.items.push(s.next++), del:(s, el) => { s.items.splice(+el.dataset.i, 1); s.runs++; if(s.never) s.items.push(s.next++); } },
    docs:() => ({ cond:'While element ' + Q('Delete button') + ' is visible on the page', inside:['Click on ' + Q('Delete button')],
      after:['Verify that the current page displays text ' + Q('All delete buttons are gone')],
      tip:'Every Delete button has the same test id. To always click the first one, use ' + xp('delete-button') + '.' }) },
  { ex:'Table rows', ui:'Table', about:'Remove the first row of the table until the table is empty.', countLabel:'Rows in the table',
    init:s => { s.next = s.count + 1; s.items = Array.from({length:s.count}, (_, i) => i + 1); },
    isTrue:s => s.items.length > 0,
    render:(s, t) => t
      ? '<div class="tbl-wrap"><table id="users-table"><thead><tr><th>Name</th><th>Email</th><th>Action</th></tr></thead><tbody>' +
        s.items.map((n, i) => '<tr><td>User ' + n + '</td><td>user' + n + '@example.com</td><td>' + B('remove-row-button', 'Remove row', 'del', {cls:'danger', multi:true, i}) + '</td></tr>').join('') + '</tbody></table></div>'
      : OK('table-empty', 'The table is empty'),
    act:{ del:(s, el) => { s.items.splice(+el.dataset.i, 1); s.runs++; if(s.never) s.items.push(s.next++); } },
    docs:() => ({ cond:'While element ' + Q('Remove row button') + ' is visible on the page', inside:['Click on ' + Q('Remove row button')],
      after:['Verify that the current page displays text ' + Q('The table is empty')],
      tip:'To click the button in the first row, use ' + xp('remove-row-button') + '.' }) },
  { ex:'Popup dialogs', ui:'Popup', about:'A popup keeps opening again. Close it until it stops coming back.', countLabel:'Times the popup opens',
    render:(s, t) => STACK(NOTE('Page content sits behind the popup.'), t
      ? '<div class="dialog-backdrop"><div class="dialog" role="dialog" aria-labelledby="popup-title" id="popup-dialog" data-testid="popup-dialog"><h3 id="popup-title">Special offer ' + (s.n + 1) + '</h3><p>Sign up today and save on your next order.</p>' + B('close-popup-button', 'Close popup', 'go', {cls:'secondary'}) + '</div></div>'
      : OK('popups-done', 'No more popups')),
    docs:() => ({ cond:'While element ' + Q('Popup dialog') + ' is visible on the page', inside:['Click on ' + Q('Close popup button')],
      after:['Verify that the current page displays text ' + Q('No more popups')], tip:'Locators: <code>#popup-dialog</code> and <code>#close-popup-button</code>.' }) }
]},
{ id:190, name:'verifyElementEnabledWhile', title:'Element is enabled', template:'While element #{label} is enabled', variants:[
  { ex:'Pagination', ui:'Button', about:'Click Next page until you reach the last page and the button turns disabled.', countLabel:'Pages after page 1',
    render:(s, t) => { let p = ''; for(let i = 1; i <= 3; i++) p += '<div class="product">Product ' + (s.n * 3 + i) + '</div>';
      return STACK('<p class="indicator" id="page-indicator" data-testid="page-indicator">Page ' + (s.n + 1) + ' of ' + (s.never ? 'many' : s.count + 1) + (t ? '' : ' (Last page)') + '</p>',
        '<div class="products">' + p + '</div>', ROW(B('next-page-button', 'Next page', 'go', {disabled:!t}))); },
    docs:() => ({ cond:'While element ' + Q('Next page button') + ' is enabled', inside:['Click on ' + Q('Next page button')],
      after:['Verify that the ' + Q('Page indicator') + ' text contains ' + Q('Last page')], tip:'Locators: <code>#next-page-button</code> and <code>#page-indicator</code>.' }) },
  { ex:'Add to cart', ui:'Stock counter', about:'Add the product to the cart until it is out of stock and the button turns disabled.', countLabel:'Items in stock',
    render:(s, t) => STACK('<h3>Desk lamp</h3>', '<p class="indicator" id="stock-label" data-testid="stock-label">' + (t ? 'In stock: ' + left(s) : 'Out of stock') + '</p>',
      NOTE('In your cart: <strong id="cart-count">' + s.n + '</strong>'), ROW(B('add-to-cart-button', 'Add to cart', 'go', {disabled:!t}))),
    docs:() => ({ cond:'While element ' + Q('Add to cart button') + ' is enabled', inside:['Click on ' + Q('Add to cart button')],
      after:['Verify that the current page displays text ' + Q('Out of stock')], tip:'Locator: <code>#add-to-cart-button</code>.' }) },
  { ex:'Tag input', ui:'Input + button', about:'Type a tag and add it, until the tag limit is reached and the Add tag button turns disabled.', countLabel:'Tag limit',
    init:s => { s.tags = []; s.tag = ''; },
    render:(s, t) => STACK(ROW(IN('tag-field', 'Tag', s.tag, {bind:'tag', ph:'e.g. qa-tag'}), B('add-tag-button', 'Add tag', 'add', {disabled:!t})),
      s.tags.length ? '<div class="chips" id="tag-list">' + s.tags.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : NOTE('No tags yet.'),
      t ? NOTE(s.n + ' of ' + (s.never ? 'many' : s.count) + ' tags used') : OK('tag-limit', 'Tag limit reached')),
    act:{ add:s => { s.tags.push((s.tag || '').trim() || 'tag-' + (s.n + 1)); s.tag = ''; s.n++; s.runs++; } },
    docs:() => ({ cond:'While element ' + Q('Add tag button') + ' is enabled', inside:['Enter ' + Q('qa-tag') + ' in the ' + Q('Tag field') + ' field', 'Click on ' + Q('Add tag button')],
      after:['Verify that the current page displays text ' + Q('Tag limit reached')], tip:'Locators: <code>#tag-field</code> and <code>#add-tag-button</code>.' }) }
]},
{ id:582, name:'verifyElementDisabledWhile', title:'Element is disabled', template:'While element #{label} is disabled', variants:[
  { ex:'Task checklist', ui:'Button', about:'Submit stays disabled until every task is done. Click Complete next task until it turns on.', countLabel:'Number of tasks',
    init:s => { s.submitted = false; },

const SC = [];
TEMPLATES.forEach(tp => tp.variants.forEach((v, i) => {
  v.key = 'while-' + tp.id + '-' + (i + 1); v.tp = tp; v.num = i + 1;
  v.isTrue = v.isTrue || on;
  v.act = Object.assign({ go:s => { s.n++; s.runs++; } }, v.act || {});
  SC.push(v);
}));

/* ---------- State ---------- */
const STATE = {};
const params = new URLSearchParams(location.search);
let firstHash = location.hash.slice(1);
function getState(sc){
  if(!STATE[sc.key]){
    let count = sc.defaultCount != null ? sc.defaultCount : 3, never = false;
    if(sc.key === firstHash){
      const c = parseInt(params.get('count'), 10);
      if(!isNaN(c) && c >= 0 && c <= 200) count = c;
      never = params.get('never') === '1';
    }
    STATE[sc.key] = {count, never};
    resetState(sc);
  }
  return STATE[sc.key];
}
function resetState(sc){ const s = STATE[sc.key]; s.n = 0; s.runs = 0; if(sc.init) sc.init(s); }

/* ---------- Render ---------- */
function pageUrl(sc, s){
  const base = location.protocol === 'file:' ? location.href.split(/[?#]/)[0] : location.origin + location.pathname;
  return base + '?count=' + s.count + (s.never ? '&never=1' : '') + '#' + sc.key;
}
function renderNav(current){
  let h = '<a href="#"' + (current ? '' : ' aria-current="page"') + '>All scenarios</a>';
  TEMPLATES.forEach(tp => {
    h += '<div class="ngroup">' + esc(tp.title) + ' <span>(ID ' + tp.id + ')</span></div>';
    tp.variants.forEach(v => { h += '<a class="sub" href="#' + v.key + '"' + (current === v ? ' aria-current="page"' : '') + '>' + esc(v.ex) + '</a>'; });
  });
  $('#nav').innerHTML = h;
}
function renderOverview(){
  renderNav(null);
  document.title = 'While loop practice page';
  $('#view').innerHTML =
    '<section class="intro"><h2>How to use this page</h2>' +
    '<p>Every ContextQA While template has 3 scenarios here, each built with a different kind of UI: buttons, inputs, checkboxes, radio buttons, tables, popups and timers. Open a scenario, set how many times the loop should run, then copy the ContextQA steps shown next to it.</p>' +
    '<p>Each scenario has its own link, so your test can open it directly. Turn on <strong>Never stop</strong> to test your safety limit, or set the count to 0 to test a loop that is skipped.</p></section>' +
    '<div class="cards">' + TEMPLATES.map(tp => '<article class="card"><h3>' + esc(tp.title) + '</h3><p class="tpl mono">' + esc(tp.template) + ' (ID ' + tp.id + ')</p><ul>' +
      tp.variants.map(v => '<li><a href="#' + v.key + '"><span>' + esc(v.ex) + '</span><span class="ui-tag">' + esc(v.ui) + '</span></a></li>').join('') + '</ul></article>').join('') + '</div>';
}
function pill(t){ return '<span class="state-pill ' + t + '" id="condPill">Condition is ' + (t ? 'true: loop keeps going' : 'false: loop ends') + '</span>'; }
function meter(sc, s){ return sc.timed ? 'Seconds passed: <strong id="runs">' + s.n + '</strong>' : 'Loop actions so far: <strong id="runs">' + s.runs + '</strong>'; }

function renderScenario(sc){
  renderNav(sc);
  document.title = sc.tp.title + ': ' + sc.ex + ' – While loop practice page';
  const s = getState(sc), d = sc.docs(s), t = sc.isTrue(s);
  const list = arr => '<ol>' + arr.map(x => '<li>' + x + '</li>').join('') + '</ol>';
  const before = ['Navigate to <span class="mono">' + esc(pageUrl(sc, s)) + '</span>'].concat(d.before || []);
  $('#view').innerHTML =
    '<section class="sc-head"><h2>' + esc(sc.tp.title) + ': ' + esc(sc.ex) + '</h2>' +
    '<p class="tpl mono">' + esc(sc.tp.template) + ' (' + esc(sc.tp.name) + ', ID ' + sc.tp.id + ')</p>' +
    '<p style="margin:8px 0 0">' + sc.about + '</p>' +
    '<div class="siblings" aria-label="Scenarios for this template">' + sc.tp.variants.map(v => '<a href="#' + v.key + '"' + (v === sc ? ' aria-current="page"' : '') + '>' + v.num + '. ' + esc(v.ex) + ' (' + esc(v.ui) + ')</a>').join('') + '</div>' +
    '<div class="setup">' +
      '<label>' + esc(sc.countLabel) + '<input type="number" id="countInput" min="0" max="200" value="' + s.count + '"></label>' +
      '<label class="check"><input type="checkbox" id="neverInput"' + (s.never ? ' checked' : '') + '> Never stop (for the safety limit test)</label>' +
      '<button class="btn" type="button" id="resetBtn">Reset scenario</button>' +
    '</div></section>' +
    '<div class="grid2">' +
      '<section class="box" aria-label="Test area"><div class="box-head"><h3>Test area</h3>' + pill(t) + '</div>' +
        '<div class="stage" id="stage">' + sc.render(s, t) + '</div>' +
        '<div class="meter"><span id="meter">' + meter(sc, s) + '</span></div></section>' +
      '<section class="box" aria-label="ContextQA steps"><div class="box-head"><h3>Steps for ContextQA</h3></div>' +
        '<div class="cq"><h4>Before the loop</h4>' + list(before) +
        '<h4>Loop condition</h4><div class="cond">' + d.cond + '</div>' +
        '<h4>Steps inside the loop</h4><div class="inside">' + list(d.inside) + '</div>' +
        '<h4>After the loop</h4>' + list(d.after) +
        '<p class="tip">' + d.tip + '</p></div>' +
        '<div class="copy-row"><button class="btn" type="button" id="copyUrl">Copy scenario link</button></div></section>' +
    '</div>';
}
function refreshStage(sc){
  const s = getState(sc), t = sc.isTrue(s);
  const active = document.activeElement, activeId = active && active.id;
  $('#stage').innerHTML = sc.render(s, t);
  $('#meter').innerHTML = meter(sc, s);
  $('#condPill').outerHTML = pill(t);
  if(activeId && $('#stage').querySelector('#' + CSS.escape(activeId))) $('#' + CSS.escape(activeId)).focus();
}
const current = () => SC.find(x => x.key === location.hash.slice(1));
function route(){
  const h = location.hash.slice(1);
  if(/^while-\d+$/.test(h) && SC.find(x => x.key === h + '-1')){ location.replace('#' + h + '-1'); return; }
  const sc = current();
  sc ? renderScenario(sc) : renderOverview();
  window.scrollTo(0, 0);
}

/* ---------- Timer for timed scenarios ---------- */
setInterval(() => {
  const sc = current();
  if(!sc || !sc.timed) return;
  const s = getState(sc);
  if(!sc.isTrue(s)) return;
  s.n++;
  refreshStage(sc);
}, 1000);

/* ---------- Events ---------- */
if(/^while-\d+$/.test(firstHash)) firstHash += '-1';
window.addEventListener('hashchange', route);

$('#view').addEventListener('click', async e => {
  const sc = current(); if(!sc) return;
  const s = getState(sc);
  const el = e.target.closest('[data-do]');
  if(el && !el.disabled && $('#stage').contains(el)){
    const fn = sc.act[el.dataset.do];
    if(fn){ fn(s, el); refreshStage(sc); }
    return;
  }
  if(e.target.id === 'resetBtn'){ resetState(sc); renderScenario(sc); toast('Scenario reset'); return; }
  if(e.target.id === 'copyUrl'){
    try{ await navigator.clipboard.writeText(pageUrl(sc, s)); toast('Link copied'); }
    catch(err){ toast('Copy is blocked here. Select the link in the steps instead.'); }
  }
});
$('#view').addEventListener('input', e => {
  const sc = current(); if(!sc) return;
  if(e.target.dataset.bind) getState(sc)[e.target.dataset.bind] = e.target.value;
});
$('#view').addEventListener('change', e => {
  const sc = current(); if(!sc) return;
  const s = getState(sc);
  if(e.target.dataset.bind){ s[e.target.dataset.bind] = e.target.value; return; }
  if(e.target.id === 'countInput'){
    const v = parseInt(e.target.value, 10);
    s.count = isNaN(v) ? 0 : Math.min(Math.max(v, 0), 200);
    resetState(sc); renderScenario(sc); $('#countInput').focus();
  }
  if(e.target.id === 'neverInput'){ s.never = e.target.checked; resetState(sc); renderScenario(sc); $('#neverInput').focus(); }
});

function toast(text){
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- Theme (shared with the builder) ---------- */
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function syncTheme(){ $('#themeBtn').textContent = isDark() ? 'Light mode' : 'Dark mode'; }
const th = store('whileLoopBuilder.theme');
if(th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
$('#themeBtn').addEventListener('click', () => { const n = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = n; store('whileLoopBuilder.theme', n); syncTheme(); });
syncTheme();

route();
</script>
</body>
</html>
