<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>While loop practice page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#18243A; --muted:#5B6880; --line:#D5DCE6;
  --accent:#2952D9; --accent-ink:#FFFFFF; --accent-soft:#E4EAFC; --accent-strong:#1F3FAE;
  --loop:#D08A12; --loop-soft:#FCF1DC; --loop-ink:#8A5A06;
  --ok:#23845A; --ok-soft:#E1F3EA; --bad:#C23B32; --bad-soft:#FBE7E5;
  --stage:#FAFBFD;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#182030; --surface-2:#1E2738; --ink:#E6EBF3; --muted:#98A3B8; --line:#2C374B;
    --accent:#7393FF; --accent-ink:#0D1426; --accent-soft:#22305A; --accent-strong:#B5C6FF;
    --loop:#F0B04A; --loop-soft:#2E2614; --loop-ink:#F5C77A;
    --ok:#4CC38A; --ok-soft:#173326; --bad:#F07167; --bad-soft:#3A1C1A; --stage:#141B28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#182030; --surface-2:#1E2738; --ink:#E6EBF3; --muted:#98A3B8; --line:#2C374B;
  --accent:#7393FF; --accent-ink:#0D1426; --accent-soft:#22305A; --accent-strong:#B5C6FF;
  --loop:#F0B04A; --loop-soft:#2E2614; --loop-ink:#F5C77A;
  --ok:#4CC38A; --ok-soft:#173326; --bad:#F07167; --bad-soft:#3A1C1A; --stage:#141B28;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit}
h1,h2,h3{margin:0}
a{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:1.3rem;font-weight:700}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.top-actions{display:flex;gap:8px;align-items:center}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding:20px 28px 40px;max-width:1500px;margin:0 auto;align-items:start}
.nav{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.nav a{display:block;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.9rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.nav .nid{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 0}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface-2)}

/* Overview */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.intro h2{font-size:1.1rem;margin-bottom:6px}
.intro p{margin:0 0 8px;max-width:75ch}
.intro p:last-child{margin-bottom:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:1rem}
.card .tpl{font-size:.8rem;color:var(--muted)}
.card p{margin:0;font-size:.88rem}
.card .btn{align-self:flex-start;margin-top:6px}

/* Scenario view */
.sc-head{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.sc-head h2{font-size:1.2rem}
.sc-head .tpl{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.setup{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.setup label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:500}
.setup input[type=number]{width:120px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.setup .check{flex-direction:row;align-items:center;gap:8px;padding-bottom:8px}
.setup .check input{width:18px;height:18px;accent-color:var(--accent)}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.box-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box-head h3{font-size:.95rem;font-weight:600}
.state-pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.state-pill.true{background:var(--loop-soft);color:var(--loop-ink)}
.state-pill.false{background:var(--ok-soft);color:var(--ok)}
.stage{background:var(--stage);padding:20px;min-height:220px;border-radius:0 0 10px 10px}
.meter{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.meter strong{color:var(--ink)}

/* Elements under test */
.t-btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer}
.t-btn:hover{filter:brightness(1.07)}
.t-btn.secondary{background:var(--surface);color:var(--accent)}
.t-btn:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.t-btn.delete-button{background:var(--surface);color:var(--bad);border-color:var(--bad);padding:6px 12px}
.t-btn.delete-button:hover{background:var(--bad-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.del-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.del-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.product{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.88rem;text-align:center}
.indicator{font-weight:600;margin:0}
.success{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:8px;padding:10px 14px;font-weight:600;margin:0}
.notice{color:var(--muted);margin:0;font-size:.9rem}
.flash{color:var(--bad);margin:0;font-size:.88rem}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
.badge.pending{background:var(--loop-soft);color:var(--loop-ink)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:4px;max-width:260px}
.field label{font-size:.85rem;font-weight:500}
.field input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:8px;align-items:center}
.tasks input{width:18px;height:18px;accent-color:var(--ok)}
.steps-bar{display:flex;gap:6px;flex-wrap:wrap}
.steps-bar span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.steps-bar span.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);font-weight:600}
.status-chip{display:inline-block;background:var(--loop-soft);color:var(--loop-ink);border-radius:6px;padding:4px 10px;font-weight:600;margin:0}

/* ContextQA steps */
.cq{padding:14px 16px}
.cq h4{font-size:.8rem;color:var(--muted);font-weight:600;margin:12px 0 4px}
.cq h4:first-child{margin-top:0}
.cq ol{margin:0;padding-left:20px;font-size:.84rem}
.cq li{margin:3px 0;overflow-wrap:anywhere}
.cq .cond{border:1px solid var(--loop);border-left-width:5px;background:var(--loop-soft);border-radius:7px;padding:8px 10px;font-size:.84rem;font-weight:500}
.cq .inside{border-left:3px solid var(--loop);margin-left:8px;padding-left:12px}
.cq .tip{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.cq code{font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.copy-row{padding:0 16px 14px}
/* Text written by ::before is not page text, so the docs never satisfy a page-text check */
.ref::before{content:"\201C" attr(data-text) "\201D";font-weight:600}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1050px){ .grid2{grid-template-columns:1fr} }
@media (max-width:780px){
  .layout{grid-template-columns:1fr;padding:14px}
  .nav{position:static;display:flex;overflow-x:auto;gap:4px}
  .nav a{white-space:nowrap}
  .nav .nid,.nav hr{display:none}
  .top{padding:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>While loop practice page</h1>
    <p>A live example for every ContextQA While template. Point your test at a scenario and watch the loop run until the condition turns false.</p>
  </div>
  <div class="top-actions">
    <a class="btn" href="index.html">Open the test builder</a>
    <button class="btn" id="themeBtn" type="button">Dark mode</button>
  </div>
</header>

<div class="layout">
  <nav class="nav" id="nav" aria-label="Scenarios"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* R() writes a value through CSS so it is visible to people but is not page text */
const R = t => '<span class="ref" data-text="' + esc(t) + '"></span>';
const Q = t => '“' + esc(t) + '”';
const $ = s => document.querySelector(s);

/* ---------- Scenarios: one per While template ---------- */
const SC = [
{
  key:'while-191', id:191, name:'verifyElementVisibleWhile', title:'Element is visible',
  template:'While element #{label} is visible on the page', example:'Delete buttons',
  about:'Keep clicking the first Delete button until no Delete buttons are left.',
  countLabel:'Delete buttons to start with',
  init:s => { s.next = s.count + 1; s.items = Array.from({length:s.count}, (_, i) => i + 1); },
  isTrue:s => s.items.length > 0,
  render:s => '<div class="stack">' +
    '<div class="row"><button class="t-btn secondary" id="add-delete-button" data-testid="add-delete-button" data-do="add">Add delete button</button>' +
    '<span class="notice" id="delete-count">' + (s.items.length ? s.items.length + ' delete button' + (s.items.length === 1 ? '' : 's') + ' left' : '') + '</span></div>' +
    (s.items.length
      ? '<ul class="del-list" id="delete-list">' + s.items.map((n, i) =>
          '<li><span>Item ' + n + '</span><button class="t-btn delete-button" data-testid="delete-button" data-do="del" data-i="' + i + '" aria-label="Delete">Delete</button></li>').join('') + '</ul>'
      : '<p class="success" id="all-deleted">All delete buttons are gone</p>') +
    (s.never ? '<p class="notice">Never-stop is on: every delete adds a new Delete button.</p>' : '') + '</div>',
  act:{
    add:s => { s.items.push(s.next++); },
    del:(s, el) => { s.items.splice(+el.dataset.i, 1); s.runs++; if(s.never) s.items.push(s.next++); }
  },
  docs:s => ({
    cond:'While element ' + Q('Delete button') + ' is visible on the page',
    inside:['Click on ' + Q('Delete button')],
    after:['Verify that the current page displays text ' + Q('All delete buttons are gone')],
    tip:'Every Delete button has <code>data-testid="delete-button"</code>. To always click the first one, use the locator <code>(//button[@data-testid=\'delete-button\'])[1]</code>.'
  })
},
{
  key:'while-190', id:190, name:'verifyElementEnabledWhile', title:'Element is enabled',
  template:'While element #{label} is enabled', example:'Pagination',
  about:'Click Next page until you reach the last page and the button turns disabled.',
  countLabel:'Pages after page 1',
  init:s => { s.page = 1; },
  isTrue:s => s.never || s.page < s.count + 1,
  render:s => {
    const last = !s.never && s.page === s.count + 1;
    let products = '';
    for(let i = 1; i <= 3; i++) products += '<div class="product">Product ' + ((s.page - 1) * 3 + i) + '</div>';
    return '<div class="stack"><p class="indicator" id="page-indicator" data-testid="page-indicator">Page ' + s.page + ' of ' + (s.never ? 'many' : s.count + 1) + (last ? ' (Last page)' : '') + '</p>' +
      '<div class="products">' + products + '</div>' +
      '<div class="row"><button class="t-btn" id="next-page-button" data-testid="next-page-button" data-do="next"' + (SC_isTrue('while-190', s) ? '' : ' disabled') + '>Next page</button></div></div>';
  },
  act:{ next:s => { s.page++; s.runs++; } },
  docs:s => ({
    cond:'While element ' + Q('Next page button') + ' is enabled',
    inside:['Click on ' + Q('Next page button')],
    after:['Verify that the ' + Q('Page indicator') + ' text contains ' + Q('Last page')],
    tip:'Locators: <code>#next-page-button</code> and <code>#page-indicator</code>.'
  })
},
{
  key:'while-582', id:582, name:'verifyElementDisabledWhile', title:'Element is disabled',
  template:'While element #{label} is disabled', example:'Task checklist',
  about:'Submit stays disabled until every task is done. Click Complete next task until it turns on.',
  countLabel:'Number of tasks',
  init:s => { s.done = 0; s.submitted = false; s.flash = ''; },
  isTrue:s => s.never || s.done < s.count,
  render:s => {
    let tasks = '';
    for(let i = 1; i <= s.count; i++) tasks += '<li><input type="checkbox" disabled' + (i <= s.done ? ' checked' : '') + ' aria-label="Task ' + i + '"><span>Task ' + i + '</span></li>';
    return '<div class="stack">' + (s.count ? '<ul class="tasks">' + tasks + '</ul>' : '<p class="notice">No tasks. Submit is ready.</p>') +
      (s.flash ? '<p class="flash">' + esc(s.flash) + '</p>' : '') +
      '<div class="row"><button class="t-btn secondary" id="complete-next-task-button" data-testid="complete-next-task-button" data-do="complete">Complete next task</button>' +
      '<button class="t-btn" id="submit-button" data-testid="submit-button" data-do="submit"' + (SC_isTrue('while-582', s) ? ' disabled' : '') + '>Submit</button></div>' +
      (s.submitted ? '<p class="success" id="form-submitted">Form submitted</p>' : '') + '</div>';
  },
  act:{
    complete:s => { s.runs++; if(s.never){ s.flash = 'Task failed. Try again.'; return; } s.flash = ''; if(s.done < s.count) s.done++; },
    submit:s => { s.submitted = true; }
  },
  docs:s => ({
    cond:'While element ' + Q('Submit button') + ' is disabled',
    inside:['Click on ' + Q('Complete next task button')],
    after:['Click on ' + Q('Submit button'), 'Verify that the current page displays text ' + Q('Form submitted')],
    tip:'Locators: <code>#complete-next-task-button</code> and <code>#submit-button</code>.'
  })
},
{
  key:'while-553', id:553, name:'verifyElementNotVisibleWhile', title:'Element is not visible',
  template:'While element #{label} is not visible on the page', example:'Retry connection',
  about:'Click Retry connection until the success message appears.',
  countLabel:'Retries before success',
  init:s => { s.tries = 0; },
  isTrue:s => s.never || s.tries < s.count,
  render:s => '<div class="stack"><p class="notice" id="connection-status">' + (SC_isTrue('while-553', s) ? 'Not connected. Attempts so far: ' + s.tries : 'Attempts: ' + s.tries) + '</p>' +
    '<div class="row"><button class="t-btn" id="retry-connection-button" data-testid="retry-connection-button" data-do="retry">Retry connection</button></div>' +
    (SC_isTrue('while-553', s) ? '' : '<p class="success" id="success-message" data-testid="success-message">Connected successfully</p>') + '</div>',
  act:{ retry:s => { s.tries++; s.runs++; } },
  docs:s => ({
    cond:'While element ' + Q('Success message') + ' is not visible on the page',
    inside:['Click on ' + Q('Retry connection button')],
    after:['Verify that the ' + Q('Success message') + ' is present (available/displayed/etc.)'],
    tip:'The success message has <code>id="success-message"</code> and only exists on the page once it shows.'
  })
},
{
  key:'while-554', id:554, name:'verifyTextVisibleWhile', title:'Text is visible',
  template:'While text #{label} is visible on the page', example:'Work queue',
  about:'A status text shows while items are in the queue. Process items until it changes.',
  countLabel:'Items in the queue',
  init:s => { s.left = s.count; },
  isTrue:s => s.left > 0,
  render:s => '<div class="stack">' + (s.left > 0
      ? '<p class="status-chip" id="queue-status" data-testid="queue-status">Processing</p><p class="notice">' + s.left + ' item' + (s.left === 1 ? '' : 's') + ' left in the queue</p>'
      : '<p class="success" id="queue-status" data-testid="queue-status">All items processed</p>') +
    '<div class="row"><button class="t-btn" id="process-next-item-button" data-testid="process-next-item-button" data-do="process">Process next item</button></div></div>',
  act:{ process:s => { s.runs++; if(!s.never && s.left > 0) s.left--; } },
  docs:s => ({
    cond:'While text ' + R('Processing') + ' is visible on the page',
    inside:['Click on ' + Q('Process next item button')],
    after:['Verify that the current page displays text ' + Q('All items processed')],
    tip:'For this template the text goes in the element field. The status text has <code>id="queue-status"</code>.'
  })
},
{
  key:'while-694', id:694, name:'verifyTextPresentWhile', title:'Page shows text',
  template:'While the current page displays text #{test-data}', example:'Product list',
  about:'Keep loading more products until the button with that text disappears from the page.',
  countLabel:'Times to load more',
  init:s => { s.loads = 0; },
  isTrue:s => s.never || s.loads < s.count,
  render:s => {
    let products = '';
    for(let i = 1; i <= 3 + s.loads * 3; i++) products += '<div class="product">Product ' + i + '</div>';
    return '<div class="stack"><div class="products" id="product-list">' + products + '</div>' +
      (SC_isTrue('while-694', s)
        ? '<div class="row"><button class="t-btn" id="load-more-button" data-testid="load-more-button" data-do="load">Load more</button></div>'
        : '<p class="success" id="end-of-list">You have seen all products</p>') + '</div>';
  },
  act:{ load:s => { s.loads++; s.runs++; } },
  docs:s => ({
    cond:'While the current page displays text ' + R('Load more'),
    inside:['Click on the ' + R('Load more') + ' button'],
    after:['Verify that the current page displays text ' + Q('You have seen all products')],
    tip:'The button has <code>id="load-more-button"</code>. Its text appears only on that button, so the page check is reliable.'
  })
},
{
  key:'while-695', id:695, name:'verifyTextAbsentWhile', title:'Page does not show text',
  template:'While the current page does not display text #{test-data}', example:'Checkout',
  about:'Go through the checkout steps until the confirmation text appears.',
  countLabel:'Checkout steps',
  init:s => { s.step = 0; },
  isTrue:s => s.never || s.step < s.count,
  render:s => {
    const names = ['Cart', 'Shipping', 'Payment', 'Review'];
    const going = SC_isTrue('while-695', s);
    const total = s.never ? names.length : s.count;
    const cur = s.never ? s.step % names.length : s.step;
    let bar = '';
    for(let i = 0; i < total; i++) bar += '<span class="' + (going && i === cur ? 'on' : '') + '">' + esc(names[i % 4] + (i >= 4 ? ' ' + (i + 1) : '')) + '</span>';
    return '<div class="stack">' + (total ? '<div class="steps-bar" aria-label="Checkout steps">' + bar + '</div>' : '') +
      (going
        ? '<p class="notice" id="checkout-step">Checkout step ' + (cur + 1) + ' of ' + total + '</p><div class="row"><button class="t-btn" id="next-checkout-step-button" data-testid="next-checkout-step-button" data-do="step">Next checkout step</button></div>'
        : '<p class="success" id="order-complete" data-testid="order-complete">Order complete</p>') + '</div>';
  },
  act:{ step:s => { s.step++; s.runs++; } },
  docs:s => ({
    cond:'While the current page does not display text ' + R('Order complete'),
    inside:['Click on ' + Q('Next checkout step button')],
    after:['Verify that the current page displays text ' + R('Order complete')],
    tip:'The confirmation has <code>id="order-complete"</code> and is not on the page until checkout ends.'
  })
},
{
  key:'while-696', id:696, name:'verifyTextContainsWhile', title:'Element text contains',
  template:'While the #{label} text contains #{test-data}', example:'Approval status',
  about:'Refresh the status until the badge no longer says Pending.',
  countLabel:'Refreshes before approval',
  init:s => { s.checks = 0; },
  isTrue:s => s.never || s.checks < s.count,
  render:s => '<div class="stack"><p>Status: <span class="badge ' + (SC_isTrue('while-696', s) ? 'pending' : 'done') + '" id="status-badge" data-testid="status-badge">' +
    (SC_isTrue('while-696', s) ? 'Pending (checked ' + s.checks + ' times)' : 'Approved') + '</span></p>' +
    '<div class="row"><button class="t-btn" id="refresh-status-button" data-testid="refresh-status-button" data-do="refresh">Refresh status</button></div></div>',
  act:{ refresh:s => { s.checks++; s.runs++; } },
  docs:s => ({
    cond:'While the ' + Q('Status badge') + ' text contains ' + Q('Pending'),
    inside:['Click on ' + Q('Refresh status button')],
    after:['Verify that the ' + Q('Status badge') + ' text contains ' + Q('Approved')],
    tip:'Locators: <code>#status-badge</code> and <code>#refresh-status-button</code>.'
  })
},
{
  key:'while-570', id:570, name:'verifyTextBoxValueEqualsWhile', title:'Input has value',
  template:'While inputbox #{label} does contain #{test-data} value', example:'Background job',
  about:'The job field says running. Check the job until the field says done.',
  countLabel:'Checks before done',
  init:s => { s.checks = 0; },
  isTrue:s => s.never || s.checks < s.count,
  render:s => '<div class="stack"><div class="field"><label for="job-status-field">Job status</label>' +
    '<input id="job-status-field" data-testid="job-status-field" name="job-status" readonly value="' + (SC_isTrue('while-570', s) ? 'running' : 'done') + '"></div>' +
    '<div class="row"><button class="t-btn" id="check-job-button" data-testid="check-job-button" data-do="check">Check job</button></div></div>',
  act:{ check:s => { s.checks++; s.runs++; } },
  docs:s => ({
    cond:'While inputbox ' + Q('Job status field') + ' does contain ' + Q('running') + ' value',
    inside:['Click on ' + Q('Check job button')],
    after:['Verify that the ' + Q('Job status field') + ' inputbox has value ' + Q('done')],
    tip:'Locators: <code>#job-status-field</code> and <code>#check-job-button</code>.'
  })
},
{
  key:'while-569', id:569, name:'verifyTextBoxValueNotEqualsWhile', title:'Input does not have value',
  template:"While inputbox #{label} doesn't contain #{test-data} value", example:'Quantity',
  about:'Increase the quantity until the field reaches the target number.',
  countLabel:'Target quantity',
  init:s => { s.qty = 0; },
  isTrue:s => !String(s.qty).includes(String(s.count)),
  render:s => '<div class="stack"><div class="field"><label for="quantity-field">Quantity</label>' +
    '<input id="quantity-field" data-testid="quantity-field" name="quantity" readonly value="' + s.qty + '"></div>' +
    '<p class="notice">Target: ' + s.count + '</p>' +
    '<div class="row"><button class="t-btn" id="increase-quantity-button" data-testid="increase-quantity-button" data-do="inc" aria-label="Increase quantity">Increase quantity (+1)</button></div></div>',
  act:{ inc:s => { s.runs++; s.qty = s.never ? (s.qty + 1) % Math.max(s.count, 1) : s.qty + 1; } },
  docs:s => ({
    cond:'While inputbox ' + Q('Quantity field') + " doesn't contain " + Q(String(s.count)) + ' value',
    inside:['Click on ' + Q('Increase quantity button')],
    after:['Verify that the ' + Q('Quantity field') + ' inputbox has value ' + Q(String(s.count))],
    tip:'The value in the condition is the target quantity you set above. Locators: <code>#quantity-field</code> and <code>#increase-quantity-button</code>.'
  })
},
{
  key:'while-697', id:697, name:'verifyEqualsValuesWhile', title:'Two values are equal',
  template:'While #{source_value} equals #{target_value}', example:'Order status variable',
  about:'Save the order status in a variable, then refresh until it is no longer pending.',
  countLabel:'Refreshes before shipped',
  init:s => { s.refreshes = 0; },
  isTrue:s => s.never || s.refreshes < s.count,
  render:s => '<div class="stack"><p>Order status: <span class="badge ' + (SC_isTrue('while-697', s) ? 'pending' : 'done') + '" id="order-status" data-testid="order-status">' +
    (SC_isTrue('while-697', s) ? 'pending' : 'shipped') + '</span></p>' +
    '<div class="row"><button class="t-btn" id="refresh-order-button" data-testid="refresh-order-button" data-do="refresh">Refresh order</button></div></div>',
  act:{ refresh:s => { s.refreshes++; s.runs++; } },
  docs:s => ({
    before:['Store text from ' + Q('Order status') + ' in a variable ' + Q('status')],
    cond:'While ' + Q('${status}') + ' equals ' + Q('pending'),
    inside:['Click on ' + Q('Refresh order button'), 'Store text from ' + Q('Order status') + ' in a variable ' + Q('status')],
    after:['Verify that the ' + Q('Order status') + ' text contains ' + Q('shipped')],
    tip:'Saving the status again inside the loop is what lets the loop end. Use the variable format your ContextQA store step creates.'
  })
}
];

const SC_isTrue = (key, s) => SC.find(x => x.key === key).isTrue(s);

/* ---------- State ---------- */
const STATE = {};
const params = new URLSearchParams(location.search);
const firstHash = location.hash.slice(1);
function getState(sc){
  if(!STATE[sc.key]){
    let count = 3, never = false;
    if(sc.key === firstHash){
      const c = parseInt(params.get('count'), 10);
      if(!isNaN(c) && c >= 0 && c <= 200) count = c;
      never = params.get('never') === '1';
    }
    if(sc.key === 'while-569' && !params.get('count')) count = 5;
    STATE[sc.key] = {count, never, runs:0};
    sc.init(STATE[sc.key]);
  }
  return STATE[sc.key];
}
function resetState(sc){ const s = getState(sc); s.runs = 0; sc.init(s); }

/* ---------- Render ---------- */
function pageUrl(sc, s){
  const base = location.origin === 'null' || location.protocol === 'file:' ? location.href.split(/[?#]/)[0] : location.origin + location.pathname;
  return base + '?count=' + s.count + (s.never ? '&never=1' : '') + '#' + sc.key;
}

function renderNav(current){
  $('#nav').innerHTML = '<a href="#" ' + (current ? '' : 'aria-current="page"') + '>All scenarios</a><hr>' +
    SC.map(sc => '<a href="#' + sc.key + '"' + (current === sc ? ' aria-current="page"' : '') + '>' + esc(sc.title) + '<span class="nid mono">ID ' + sc.id + '</span></a>').join('');
}

function renderOverview(){
  renderNav(null);
  document.title = 'While loop practice page';
  $('#view').innerHTML =
    '<section class="intro"><h2>How to use this page</h2>' +
    '<p>Each scenario below is a small working page for one While template. Open a scenario, set how many times the loop should run, then use the ContextQA steps shown next to it. Your test clicks the button again and again, and the loop ends when the condition turns false.</p>' +
    '<p>Every scenario has its own link, so your test can open it directly. Turn on <strong>Never stop</strong> to test your safety limit, or set the count to 0 to test a loop that is skipped.</p></section>' +
    '<div class="cards">' + SC.map(sc =>
      '<article class="card"><h3>' + esc(sc.title) + '</h3><p class="tpl mono">' + esc(sc.template) + '</p>' +
      '<p>' + esc(sc.about) + '</p><a class="btn" href="#' + sc.key + '">Open ' + esc(sc.example.toLowerCase()) + ' example</a></article>').join('') + '</div>';
}

function renderScenario(sc){
  renderNav(sc);
  document.title = sc.title + ' – While loop practice page';
  const s = getState(sc);
  const d = sc.docs(s);
  const isTrue = sc.isTrue(s);
  const list = arr => '<ol>' + arr.map(x => '<li>' + x + '</li>').join('') + '</ol>';
  const url = pageUrl(sc, s);
  const before = ['Navigate to <span class="mono">' + esc(url) + '</span>'].concat(d.before || []);

  $('#view').innerHTML =
    '<section class="sc-head"><h2>' + esc(sc.title) + ': ' + esc(sc.example.toLowerCase()) + '</h2>' +
    '<p class="tpl mono">' + esc(sc.template) + ' (' + esc(sc.name) + ', ID ' + sc.id + ')</p>' +
    '<p style="margin:8px 0 0">' + esc(sc.about) + '</p>' +
    '<div class="setup">' +
      '<label>' + esc(sc.countLabel) + '<input type="number" id="countInput" min="0" max="200" value="' + s.count + '"></label>' +
      '<label class="check"><input type="checkbox" id="neverInput"' + (s.never ? ' checked' : '') + '> Never stop (for the safety limit test)</label>' +
      '<button class="btn" type="button" id="resetBtn">Reset scenario</button>' +
    '</div></section>' +
    '<div class="grid2">' +
      '<section class="box" aria-label="Test area"><div class="box-head"><h3>Test area</h3>' +
        '<span class="state-pill ' + isTrue + '" id="condPill">Condition is ' + (isTrue ? 'true: loop keeps going' : 'false: loop ends') + '</span></div>' +
        '<div class="stage" id="stage" data-scenario="' + sc.key + '">' + sc.render(s) + '</div>' +
        '<div class="meter"><span>Loop clicks so far: <strong id="runs">' + s.runs + '</strong></span></div>' +
      '</section>' +
      '<section class="box" aria-label="ContextQA steps"><div class="box-head"><h3>Steps for ContextQA</h3></div>' +
        '<div class="cq"><h4>Before the loop</h4>' + list(before) +
        '<h4>Loop condition</h4><div class="cond">' + d.cond + '</div>' +
        '<h4>Steps inside the loop</h4><div class="inside">' + list(d.inside) + '</div>' +
        '<h4>After the loop</h4>' + list(d.after) +
        '<p class="tip">' + d.tip + '</p></div>' +
        '<div class="copy-row"><button class="btn" type="button" id="copyUrl">Copy scenario link</button></div>' +
      '</section>' +
    '</div>';
}

function refreshStage(sc){
  const s = getState(sc), isTrue = sc.isTrue(s);
  $('#stage').innerHTML = sc.render(s);
  $('#runs').textContent = s.runs;
  const pill = $('#condPill');
  pill.className = 'state-pill ' + isTrue;
  pill.textContent = 'Condition is ' + (isTrue ? 'true: loop keeps going' : 'false: loop ends');
}

function route(){
  const sc = SC.find(x => x.key === location.hash.slice(1));
  sc ? renderScenario(sc) : renderOverview();
  window.scrollTo(0, 0);
}

/* ---------- Events ---------- */
window.addEventListener('hashchange', route);

$('#view').addEventListener('click', async e => {
  const sc = SC.find(x => x.key === location.hash.slice(1));
  if(!sc) return;
  const s = getState(sc);
  const doBtn = e.target.closest('[data-do]');
  if(doBtn && !doBtn.disabled){
    const fn = sc.act[doBtn.dataset.do];
    if(fn){ fn(s, doBtn); refreshStage(sc); }
    return;
  }
  if(e.target.id === 'resetBtn'){ resetState(sc); renderScenario(sc); toast('Scenario reset'); return; }
  if(e.target.id === 'copyUrl'){
    try{ await navigator.clipboard.writeText(pageUrl(sc, s)); toast('Link copied'); }
    catch(err){ toast('Copy is blocked here. Select the link in the steps instead.'); }
  }
});

$('#view').addEventListener('change', e => {
  const sc = SC.find(x => x.key === location.hash.slice(1));
  if(!sc) return;
  const s = getState(sc);
  if(e.target.id === 'countInput'){
    const v = parseInt(e.target.value, 10);
    s.count = isNaN(v) ? 0 : Math.min(Math.max(v, 0), 200);
    resetState(sc); renderScenario(sc); $('#countInput').focus();
  }
  if(e.target.id === 'neverInput'){
    s.never = e.target.checked;
    resetState(sc); renderScenario(sc); $('#neverInput').focus();
  }
});

function toast(text){
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- Theme (shared with the builder) ---------- */
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function syncTheme(){ $('#themeBtn').textContent = isDark() ? 'Light mode' : 'Dark mode'; }
const th = store('whileLoopBuilder.theme');
if(th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
$('#themeBtn').addEventListener('click', () => { const n = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = n; store('whileLoopBuilder.theme', n); syncTheme(); });
syncTheme();

route();
</script>
</body>
</html>
